[workspace]
channels = ["https://conda.modular.com/max", "conda-forge"]
name = "mu"
platforms = ["osx-arm64"]
version = "0.5.0"

[tasks]
mu = { cmd = "mojo run -I src src/main.mojo", cwd = "." }
build = { cmd = "mkdir -p build && mojo build -I src -o build/mu src/main.mojo && cp src/mu_runtime.py build/mu_runtime.py", cwd = "." }
test = { cmd = "mojo run -I src tests/test_text.mojo && mojo run -I src tests/test_tools.mojo && mojo run -I src tests/test_history.mojo && mojo run -I src tests/test_loop.mojo && mojo run -I src tests/test_openai.mojo && mojo run -I src tests/test_session.mojo && mojo run -I src tests/test_context.mojo && mojo run -I src tests/test_settings.mojo && mojo run -I src tests/test_skills.mojo && mojo run -I src tests/test_templates.mojo", cwd = "." }
fmt = { cmd = "mojo format src tests", cwd = "." }

[dependencies]
mojo = ">=1.0.0,<2"
python = "==3.12"
